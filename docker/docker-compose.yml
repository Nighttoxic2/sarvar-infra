version: '3.8'

services:
  # ===== IMMICH PHOTO SERVER =====
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    extends:
      file: hwaccel.transcoding.yml
      service: quicksync
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file: .env
    ports:
      - '192.168.50.131:2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file: .env
    environment:
      - MACHINE_LEARNING_PRELOAD__CLIP=ViT-B-16-SigLIP__webli
      - MACHINE_LEARNING_MODEL_TTL=0
    deploy:
      resources:
        limits:
          memory: 6G
    restart: always
    healthcheck:
      disable: false

  # ===== DATABASE & CACHE =====
  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:16-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

  # ===== REVERSE PROXY & SERVICES =====
  nginx-proxy-manager:
    container_name: npm
    image: 'jc21/nginx-proxy-manager:latest'
    restart: unless-stopped
    ports:
      - '192.168.50.131:80:80'
      - '192.168.50.131:443:443'
      - '192.168.50.131:81:81'
    volumes:
      - ./npm-data:/data
      - ./npm-letsencrypt:/etc/letsencrypt
    depends_on:
      - immich-server

  # ===== MEDIA STACK =====
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    volumes:
      - /mnt/Data/media:/media
      - /mnt/Data/config/jellyfin:/config
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '192.168.50.131:8096:8096'
    restart: unless-stopped
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0

  # ===== *ARR STACK =====
  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuala_Lumpur
    volumes:
      - /mnt/Data/config/prowlarr:/config
    ports:
      - '192.168.50.131:9696:9696'
    restart: unless-stopped

  sonarr:
    container_name: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuala_Lumpur
    volumes:
      - /mnt/Data/config/sonarr:/config
      - /mnt/Data/media:/media
    ports:
      - '192.168.50.131:8989:8989'
    restart: unless-stopped

  radarr:
    container_name: radarr
    image: lscr.io/linuxserver/radarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuala_Lumpur
    volumes:
      - /mnt/Data/config/radarr:/config
      - /mnt/Data/media:/media
    ports:
      - '192.168.50.131:7878:7878'
    restart: unless-stopped

  lidarr:
    container_name: lidarr
    image: lscr.io/linuxserver/lidarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuala_Lumpur
    volumes:
      - /mnt/Data/config/lidarr:/config
      - /mnt/Data/media:/media
    ports:
      - '192.168.50.131:8686:8686'
    restart: unless-stopped

  bazarr:
    container_name: bazarr
    image: lscr.io/linuxserver/bazarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuala_Lumpur
    volumes:
      - /mnt/Data/config/bazarr:/config
      - /mnt/Data/media:/media
    ports:
      - '192.168.50.131:6767:6767'
    restart: unless-stopped

  # ===== DOWNLOADS =====
  qbittorrent:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuala_Lumpur
      - WEBUI_PORT=8080
    volumes:
      - /mnt/Data/config/qbittorrent:/config
      - /mnt/Data/downloads:/downloads
    ports:
      - '192.168.50.131:6881:6881'
      - '192.168.50.131:6881:6881/udp'
      - '192.168.50.131:8082:8080'
    restart: unless-stopped

  flaresolverr:
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      - TZ=Asia/Kuala_Lumpur
    ports:
      - '192.168.50.131:8181:8191'
    restart: unless-stopped

  # ===== MONITORING & UTILITIES =====
  vaultwarden:
    container_name: vaultwarden
    image: vaultwarden/server:latest
    volumes:
      - /mnt/Data/config/vaultwarden:/data
    ports:
      - '192.168.50.131:8083:80'
    restart: unless-stopped

  seerr:
    container_name: seerr
    image: lscr.io/linuxserver/seerr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kuala_Lumpur
    volumes:
      - /mnt/Data/config/seerr:/config
    ports:
      - '192.168.50.131:5055:5055'
    restart: unless-stopped

  n8n:
    container_name: n8n
    image: docker.io/n8nio/n8n:latest
    environment:
      - N8N_HOST=192.168.50.131
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://192.168.50.131:5678/
      - GENERIC_TIMEZONE=Asia/Kuala_Lumpur
    volumes:
      - /mnt/Data/config/n8n:/home/node/.n8n
    ports:
      - '192.168.50.131:5678:5678'
    restart: unless-stopped

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    environment:
      - TZ=Asia/Kuala_Lumpur
      - WEBPASSWORD_FILE=/run/secrets/pihole_password
      - DNS1=9.9.9.9
      - DNS2=1.1.1.1
      - CONDITIONAL_FORWARDING=192.168.50.1
    volumes:
      - /mnt/Data/config/pihole:/etc/pihole
      - /mnt/Data/config/pihole/dnsmasq.d:/etc/dnsmasq.d
    ports:
      - '192.168.50.131:53:53/tcp'
      - '192.168.50.131:53:53/udp'
      - '192.168.50.131:67:67/udp'
      - '192.168.50.131:8081:80/tcp'
    restart: unless-stopped
    cap_add:
      - NET_ADMIN

  # ===== WATCHTOWER =====
  watchtower:
    container_name: watchtower
    image: containrrr/watchtower:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=86400

volumes:
  model-cache:
  pgdata:
